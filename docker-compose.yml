version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    hostname: db
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # DB is internal only (no published port)
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      target: production
    hostname: api
    container_name: api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --workers ${API_WORKERS:-4}
    environment:
      # Database connection
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-appdb}

      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-4}
      DEBUG: ${DEBUG:-false}

      # Security
      SECRET_KEY: ${SECRET_KEY:-IH6eTU59ilNk3Jen7MyChWLjHMrbtmQEEXHIk25CuBOGV5nuBH1p42C85bdLaC3z}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_ENV: production
    # Expose API to the host directly (nginx removed)
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
    driver: local

networks:
  app_net:
    driver: bridge
