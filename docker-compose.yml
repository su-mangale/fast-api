services:
  db:
    image: postgres:15
    restart: unless-stopped
    hostname: db
    container_name: ${COMPOSE_PROJECT_NAME:-project}-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # Remove external port exposure for production security
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: 
      context: .
      target: production
    hostname: api
    container_name: ${COMPOSE_PROJECT_NAME:-project}-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --workers ${API_WORKERS:-4}
    # All environment variables defined here - no .env files needed
    environment:
      # Database connection
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-appdb}
      
      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-4}
      DEBUG: ${DEBUG:-false}
      
      # Security
      SECRET_KEY: IH6eTU59ilNk3Jen7MyChWLjHMrbtmQEEXHIk25CuBOGV5nuBH1p42C85bdLaC3z
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_ENV: production
    # SECURITY: No external port exposure - only accessible via nginx
    # ports:
    #   - "${API_PORT:-8000}:${API_PORT:-8000}"  # Commented out for production security
    expose:
      - "${API_PORT:-8000}"  # Only expose to internal networks
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal  # Only internal network - no external access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx reverse proxy - the only service exposed externally
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-project}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - internal  # To communicate with API
      - external  # To receive external traffic
    profiles:
      - production

volumes:
  pgdata:
    driver: local

networks:
  # Internal network for service-to-service communication
  internal:
    driver: bridge
    internal: true
    
  # External network for public access
  external:
    driver: bridge
