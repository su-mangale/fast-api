---
# Ultra Simple Site Playbook
- import_playbook: configure-server.yml
- import_playbook: deploy-app.yml

- name: Display Completion Message
  hosts: all
  gather_facts: no
  
  tasks:
    - name: Display completion message
      debug:
        msg: |
          FastAPI deployment completed!
          Application: http://{{ ansible_host }}:{{ app_port }}
          API Docs: http://{{ ansible_host }}:{{ app_port }}/docs
          Health: http://{{ ansible_host }}:{{ app_port }}/health
          Database: PostgreSQL on port {{ db_port }}
