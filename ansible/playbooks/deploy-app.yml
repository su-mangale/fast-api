---
# Simplified application deployment (Docker Compose only)
- name: Deploy FastAPI Application
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    # Ensure git is installed
    - name: Ensure git is installed
      package:
        name: git
        state: present

    # Clean up any existing directory with ownership issues
    - name: Remove existing application directory
      file:
        path: "{{ app_directory }}"
        state: absent
      ignore_errors: yes

    # Create fresh application directory with correct ownership
    - name: Create fresh application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    # Clone Repository
    - name: Clone application repository
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_directory }}"
        version: "{{ git_branch }}"
        force: yes
      register: git_clone_result
      ignore_errors: yes

    # Fallback clone method if git module fails
    - name: Clone repository using shell (fallback)
      shell: |
        rm -rf {{ app_directory }}
        git clone {{ git_repo }} {{ app_directory }}
        cd {{ app_directory }}
        git checkout {{ git_branch }}
      when: git_clone_result.failed is defined and git_clone_result.failed
      register: shell_clone_result

    - name: Set directory ownership after clone
      file:
        path: "{{ app_directory }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    # Create configuration files
    - name: Create .env file for Docker Compose
      template:
        src: ../roles/fastapi/templates/env.j2
        dest: "{{ app_directory }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0640'

    # Verify required files exist in repository
    - name: Verify docker-compose.yml exists in repository
      stat:
        path: "{{ app_directory }}/docker-compose.yml"
      register: compose_file

    - name: Fail if docker-compose.yml is missing
      fail:
        msg: "docker-compose.yml not found in repository at {{ app_directory }}/docker-compose.yml"
      when: not compose_file.stat.exists

    - name: Verify nginx.conf exists in repository
      stat:
        path: "{{ app_directory }}/nginx.conf"
      register: nginx_conf_file

    - name: Fail if nginx.conf is missing
      fail:
        msg: "nginx.conf not found in repository at {{ app_directory }}/nginx.conf"
      when: not nginx_conf_file.stat.exists

    # Validate and deploy
    - name: Validate docker-compose.yml syntax
      shell: cd {{ app_directory }} && docker compose config
      register: compose_validation
      ignore_errors: yes

    - name: Show compose validation result
      debug:
        msg: "Compose validation: {{ 'PASSED' if compose_validation.rc == 0 else 'FAILED' }}"

    # Clean up existing containers
    - name: Stop and remove existing containers
      shell: |
        cd {{ app_directory }}
        docker compose down -v --remove-orphans 2>/dev/null || true
      ignore_errors: yes

    # Deploy application using direct docker commands (fallback for compatibility)
    - name: Create Docker network
      shell: docker network create fastapi-internal 2>/dev/null || true
      ignore_errors: yes

    - name: Create Docker network external
      shell: docker network create fastapi-external 2>/dev/null || true
      ignore_errors: yes

    - name: Stop and remove existing containers
      shell: |
        docker stop fastapi-app-db fastapi-app-api fastapi-app-nginx db api nginx 2>/dev/null || true
        docker rm fastapi-app-db fastapi-app-api fastapi-app-nginx db api nginx 2>/dev/null || true
      ignore_errors: yes

    - name: Start PostgreSQL database
      shell: |
        cd {{ app_directory }}
        docker run -d \
          --name db \
          --network fastapi-internal \
          --env-file .env \
          -e POSTGRES_USER={{ db_user }} \
          -e POSTGRES_PASSWORD={{ db_password }} \
          -e POSTGRES_DB={{ db_name }} \
          -v fastapi-pgdata:/var/lib/postgresql/data \
          postgres:15
      register: db_start_result

    - name: Wait for database to be ready
      shell: sleep 10
      when: db_start_result.rc == 0

    - name: Build and start FastAPI application
      shell: |
        cd {{ app_directory }}
        docker build -t fastapi-app:latest .
        docker run -d \
          --name api \
          --network fastapi-internal \
          --env-file .env \
          -e DATABASE_URL=postgresql://{{ db_user }}:{{ db_password }}@db:5432/{{ db_name }} \
          fastapi-app:latest
      register: api_start_result

    - name: Start Nginx reverse proxy
      shell: |
        cd {{ app_directory }}
        docker run -d \
          --name nginx \
          --network fastapi-internal \
          --network fastapi-external \
          -p 80:80 \
          -p 443:443 \
          -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro \
          nginx:alpine
      register: nginx_start_result

    - name: Show deployment results
      debug:
        msg: |
          Database: {{ 'STARTED' if db_start_result.rc == 0 else 'FAILED' }}
          API: {{ 'STARTED' if api_start_result.rc == 0 else 'FAILED' }}
          Nginx: {{ 'STARTED' if nginx_start_result.rc == 0 else 'FAILED' }}

    # Test deployment
    - name: Wait for application to be ready
      wait_for:
        port: 80
        timeout: 60

    - name: Test health endpoint via nginx
      uri:
        url: "http://localhost/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes
      register: health_check

    - name: Show health check result
      debug:
        msg: "Health check: {{ 'PASSED' if health_check.status == 200 else 'FAILED' }}"
