---
# Simplified server configuration (no PostgreSQL setup)
- name: Configure Server Environment
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    # System Updates
    - name: Update system (Ubuntu/Debian)
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update system (RedHat/Amazon Linux)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    # Install Common Packages
    - name: Install packages (Ubuntu/Debian)
      apt:
        name: "{{ common_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install packages (RedHat/Amazon Linux)
      yum:
        name: "{{ common_packages }}"
        state: present
      when: ansible_os_family == "RedHat"

    # Install Python and Docker
    - name: Install Python and Docker (Ubuntu/Debian)
      apt:
        name: 
          - python3
          - python3-pip
          - python3-venv
          - docker.io
        state: present
      when: ansible_os_family == "Debian"

    # Install Docker Compose
    - name: Install Docker Compose via pip
      pip:
        name: docker-compose
        executable: pip3

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: docker_compose_version
      failed_when: false

    - name: Show Docker Compose version
      debug:
        msg: "Docker Compose version: {{ docker_compose_version.stdout }}"
      when: docker_compose_version.rc == 0

    - name: Install Python and Docker (RedHat/Amazon Linux)
      yum:
        name:
          - python3
          - docker
        state: present
      when: ansible_os_family == "RedHat"

    # Start Services
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # Create Application User
    - name: Create application user
      user:
        name: "{{ app_user }}"
        create_home: yes
        shell: /bin/bash

    - name: Add user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    # Create App Directory
    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
