# Ansible Inventory File
# Update the IP address with your EC2 instance IP from Terraform output

all:
  children:
    fastapi_servers:
      hosts:
        fastapi-server:
          ansible_host: 3.6.39.82  # Replace with actual IP from terraform output
          ansible_user: ubuntu           # For Ubuntu instances
          ansible_ssh_private_key_file: ~/.ssh/default.pem
          ansible_python_interpreter: /usr/bin/python3
          
          # Host-specific variables
          server_role: web
          environment: dev

