# Global Variables for All Hosts
# Ultra Simple Configuration

# Application Configuration
app_name: fastapi-app
app_user: appuser
app_directory: /opt/fastapi-app
app_port: 8000

# Repository Configuration
git_repo: "https://github.com/su-mangale/fast-api.git"  # Update with your repo
git_branch: main

# Database Configuration
db_name: fastapi_db
db_user: fastapi_user
db_password: fastapi_password123  # Change in production
db_host: localhost
db_port: 5432

# Environment Variables
app_env_vars:
  DATABASE_URL: "postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}"
  API_HOST: "0.0.0.0"
  API_PORT: "{{ app_port }}"

# Production Settings
api_workers: 4
compose_project_name: "{{ app_name }}"
nginx_port: 80
nginx_ssl_port: 443

# Security
secret_key: "IH6eTU59ilNk3Jen7MyChWLjHMrbtmQEEXHIk25CuBOGV5nuBH1p42C85bdLaC3z"
algorithm: "HS256"
access_token_expire_minutes: 30

# System Packages
common_packages:
  - git
  - curl
  - wget
  - vim
